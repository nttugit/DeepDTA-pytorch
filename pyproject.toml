[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "binding-affinity-prediction-deepdta"
description = "PyTorch DeepDTA for drug–target binding affinity prediction"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "tqdm",
]
